<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { "sans": ["Inter", "sans-serif"] },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                },
            },
        }
    </script>
    <style>
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 p-10 font-sans">

    <div class="flex flex-col gap-4 w-full max-w-2xl">
        
        <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-slate-700">Flowro AI</span>
            <span class="inline-flex items-center rounded-full bg-violet-100 px-2 py-0.5 text-[10px] font-bold text-violet-700 ring-1 ring-inset ring-violet-700/10 animate-pulse-slow">
                ACTIVE SESSION
            </span>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm ring-1 ring-slate-100">
            <div class="flex flex-col gap-4">
                
                <div class="flex items-center gap-3">
                    <span class="text-sm font-medium text-slate-600">
                        Extracted Core Intent: <span class="text-slate-900 font-semibold">Real Estate CRM SaaS</span>
                    </span>
                </div>

                <div class="flex items-center gap-3">
                    <div class="relative flex size-3 items-center justify-center">
                        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-violet-400 opacity-75"></span>
                        <span class="relative inline-flex size-2 rounded-full bg-violet-500"></span>
                    </div>
                    <span class="text-sm font-semibold text-violet-700">Mapping Actors & Relationships...</span>
                </div>

                <div class="ml-6 border-l-2 border-slate-100 pl-4 py-1">
                    <div class="flex flex-col gap-2">
                        <div class="text-xs font-medium text-slate-500 tracking-wide">Actor: Admin / Agent</div>
                        <div class="text-xs font-medium text-slate-500 tracking-wide">Entity: Property Listing</div>
                        <div class="text-xs font-medium text-slate-500 tracking-wide">Entity: Client Profile</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-1 pl-2 opacity-60">
            <span class="size-1.5 rounded-full bg-slate-400 typing-dot"></span>
            <span class="size-1.5 rounded-full bg-slate-400 typing-dot"></span>
            <span class="size-1.5 rounded-full bg-slate-400 typing-dot"></span>
        </div>
        
    </div>

</body>
</html>
